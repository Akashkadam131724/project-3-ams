<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMS — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0f1c14;
        --muted: #4a5c50;
        --line: #c8d4cc;
        --paper: #f3f6f2;
        --field: #ffffff;
        --accent: #1a6b45;
        --accent-hover: #145536;
        --danger: #9b2c2c;
        --danger-bg: #fdecec;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 60% at 10% 0%, #d8ebe0 0%, transparent 55%),
          radial-gradient(ellipse 70% 50% at 100% 100%, #cfe0d6 0%, transparent 50%),
          linear-gradient(165deg, #eef3ef 0%, #e2ebe5 45%, #d6e2da 100%);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      body.checking .shell {
        opacity: 0;
      }

      .shell {
        width: min(100%, 420px);
        animation: rise 0.55s ease-out both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .brand h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.75rem, 8vw, 3.5rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--ink);
      }

      .brand p {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        color: var(--muted);
      }

      form {
        background: color-mix(in srgb, var(--paper) 88%, white);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1.75rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
        backdrop-filter: blur(8px);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input {
        font: inherit;
        font-size: 1rem;
        font-weight: 400;
        text-transform: none;
        letter-spacing: normal;
        color: var(--ink);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0.75rem 0.85rem;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      button {
        margin-top: 0.35rem;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 3px;
        padding: 0.85rem 1rem;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.12s ease;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .status {
        display: none;
        font-size: 0.9rem;
        line-height: 1.4;
        padding: 0.7rem 0.85rem;
        border-radius: 3px;
      }

      .status.show {
        display: block;
        animation: rise 0.25s ease-out both;
      }

      .status.error {
        color: var(--danger);
        background: var(--danger-bg);
      }
    </style>
  </head>
  <body class="checking">
    <div class="shell">
      <header class="brand">
        <h1>AMS Update</h1>
        <p>Sign in to continue</p>
      </header>

      <form id="login-form" autocomplete="on">
        <div id="status" class="status" role="alert" aria-live="polite"></div>

        <label>
          Email
          <input
            type="email"
            name="email"
            id="email"
            required
            autocomplete="email"
            placeholder="you@company.com"
            value="superadmin@ams.com"
          />
        </label>

        <label>
          Password
          <input
            type="password"
            name="password"
            id="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            value="SuperAdmin1!"
          />
        </label>

        <button type="submit" id="submit-btn">Sign in</button>
      </form>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit-btn");

      function showStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = `status show ${type}`;
      }

      function clearStatus() {
        statusEl.textContent = "";
        statusEl.className = "status";
      }

      async function redirectIfLoggedIn() {
        try {
          const res = await fetch("/api/v1/auth/me", { credentials: "include" });
          if (res.ok) {
            window.location.replace("/");
            return;
          }
        } catch {
          /* stay on login */
        }
        document.body.classList.remove("checking");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearStatus();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";

        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            let message = data.message || "Invalid email or password";
            if (data.errorType === "field" && data.errors) {
              const first = Object.values(data.errors).flat()[0];
              if (first) message = first;
            }
            showStatus(message, "error");
            return;
          }

          window.location.replace("/");
        } catch {
          showStatus("Could not reach the server. Try again.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
        }
      });

      redirectIfLoggedIn();
    </script>
  </body>
</html>
